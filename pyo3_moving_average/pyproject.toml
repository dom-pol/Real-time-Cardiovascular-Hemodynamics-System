[project]
name = "pyo3-moving-average"
version = "0.1.0"
description = "A Python library for calculating a moving average using Rust's Functions"
readme = "README.md"
authors = [
    { name = "dom-pol", email = "dominicpolniaszek@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
features =["pyo3/extension-module"]
module-name = "pyo3_moving_average._core"
python-source = "python"
